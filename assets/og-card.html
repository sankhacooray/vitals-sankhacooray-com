<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0e120a;
    color: #f2efe2;
    background-image:
      radial-gradient(900px 460px at 16% -8%, rgba(168,196,90,0.14), transparent 60%),
      radial-gradient(820px 560px at 104% 18%, rgba(227,169,76,0.10), transparent 60%);
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500;
    color: #a8c45a; text-transform: uppercase; letter-spacing: 4px;
  }
  h1 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 96px; line-height: 1.02; letter-spacing: -2px; margin-top: 28px;
  }
  h1 em { color: #a8c45a; font-style: italic; }
  .lede {
    font-size: 25px; color: #aab09a; max-width: 720px; margin-top: 30px; line-height: 1.45;
  }
  .foot { display: flex; align-items: baseline; gap: 18px; }
  .mark { font-family: 'Instrument Serif', serif; font-size: 40px; color: #a8c45a; letter-spacing: -0.5px; }
  .by { font-family: 'JetBrains Mono', monospace; font-size: 17px; color: #6f7560; letter-spacing: 1px; }
  .url { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 17px; color: #aab09a; letter-spacing: 1px; }
  .pulse { position: absolute; right: 70px; top: 90px; opacity: 0.9; }
</style>
</head>
<body>
  <svg class="pulse" width="320" height="120" viewBox="0 0 320 120">
    <polyline points="0,60 110,60 140,60 162,22 190,98 218,14 244,60 270,60 320,60"
      fill="none" stroke="#e3a94c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </svg>

  <div>
    <div class="eyebrow">nutrition · fasting · metabolism</div>
    <h1>Eating less,<br>watching <em>closer</em>.</h1>
    <div class="lede">Field notes on intermittent fasting, the lean-mass hyper-responder phenotype, and live self-tracked vitals.</div>
  </div>

  <div class="foot">
    <span class="mark">vitals</span>
    <span class="by">Sankha Cooray</span>
    <span class="url">vitals.sankhacooray.com</span>
  </div>
</body>
</html>
